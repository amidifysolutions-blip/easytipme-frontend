<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>All set — EasyTipMe</title>
  <link rel="icon" href="favicon.svg" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",Arial,sans-serif;
      background:#f0f0f2;color:#1d1d1f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:22px;padding:38px 26px;max-width:380px;width:100%;text-align:center;
      box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .check{width:74px;height:74px;border-radius:50%;background:#eef7ee;color:#1f9d55;
      display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px}
    h1{font-size:23px;letter-spacing:-.02em;margin-bottom:10px}
    p{font-size:15px;color:#555;line-height:1.55;margin-bottom:8px}
    .ar{direction:rtl;font-size:15px;color:#555;line-height:1.7;margin-top:14px;
      border-top:1px solid #eee;padding-top:14px}
    .brand{margin-top:22px;font-size:13px;color:#8a8a8e;letter-spacing:.02em}
    .brand b{color:#1d1d1f}
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>You're all set!</h1>
    <p>Your bank details are saved. You can return to the <b>EasyTipMe</b> app now to see your payout status.</p>
    <p style="color:#8a8a8e;font-size:13px">You can close this page.</p>
    <div class="ar">
      تمّ حفظ بيانات حسابك البنكي. ارجع لتطبيق <b>EasyTipMe</b> لتشوف حالة التحويلات. فيك تسكّر هالصفحة.
    </div>
    <div class="brand">Easy<b>Tip</b>Me</div>
  </div>
</body>
</html>
